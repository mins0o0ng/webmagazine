# Supabase CLI 설정.
#   supabase link --project-ref <ref>
#   supabase db push
#
# 마이그레이션 파일 이름은 CLI 규약(YYYYMMDDHHMMSS_이름.sql)을 따라야 인식된다.

project_id = "webmagazine"

[db]
# 로컬 `supabase start` 용 포트. 원격 프로젝트와는 무관하다.
port = 54322
# 원격 프로젝트의 Postgres major 버전과 맞춰야 db diff 가 어긋나지 않는다.
# Supabase 대시보드 → Settings → Database 에서 확인하고 다르면 고칠 것.
major_version = 15

[auth]
# M2 에서 매직링크를 쓴다(기획안 §5.1). 비밀번호 재설정 플로우를 만들지 않기 위해서다.
enable_signup = true

[auth.email]
enable_signup = true
# 매직링크만 쓰므로 비밀번호 가입은 닫아둔다.
enable_confirmations = true
