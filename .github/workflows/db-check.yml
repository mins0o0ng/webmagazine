name: DB 점검

# 손으로만 돌린다. 푸시마다 돌리지 않는 이유는 이 워크플로가 진짜 Supabase
# 프로젝트에 붙어 테스트 계정을 만들고 지우기 때문이다. 개발용 프로젝트에서만 쓸 것.
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: '편집장으로 지정할 이메일 (비우면 건너뜀)'
        required: false
        type: string
      run_rls_test:
        description: 'RLS 우회 테스트를 돌린다 (테스트 계정 3개를 만들었다 지움)'
        required: true
        type: boolean
        default: true

concurrency:
  # 같은 DB 에 두 번 동시에 붙으면 테스트가 서로를 밟는다.
  group: db-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # URL 은 대시보드에서 복사한 그대로 ([YOUR-PASSWORD] 포함), 비밀번호는 원문.
      # 합치고 인코딩하는 일은 scripts/db-url.mjs 가 한다 — 사람이 %40 을 적지 않는다.
      #
      # 여기서 DATABASE_URL 이라는 이름을 쓰지 않는 것이 중요하다. job 의 env 블록은
      # $GITHUB_ENV 로 나중에 넣은 값을 덮어쓴다. 같은 이름을 쓰면 조립한 문자열이
      # 뒤 단계에 절대 도달하지 못하고, 자리표시자가 그대로 psql 에 넘어간다.
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # 22 이상이어야 한다. @supabase/supabase-js(realtime-js)가 네이티브
      # WebSocket 을 찾는데, Node 20 에는 없어서 createClient 자체가 죽는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 필요한 secret 이 다 있는지 먼저 본다
        run: |
          missing=()
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]      || missing+=("SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing+=("SUPABASE_ANON_KEY")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]     || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "$SUPABASE_DATABASE_URL" ]         || missing+=("SUPABASE_DATABASE_URL")
          # SUPABASE_DB_PASSWORD 는 URL 에 비밀번호를 직접 박아 넣은 예전 방식이면
          # 없어도 된다. 자리표시자가 남아 있을 때만 필수다.
          case "$SUPABASE_DATABASE_URL" in
            *YOUR-PASSWORD*|*'[PASSWORD]'*)
              [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD") ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::secret 이 없습니다: ${missing[*]}"
            {
              echo '## 설정이 덜 됐습니다'
              echo ''
              echo "없는 secret: \`${missing[*]}\`"
              echo ''
              echo '저장소 **Settings → Secrets and variables → Actions** 에서 추가하세요.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      # psql 은 URL 하나만 받는다. db-migrate 와 같은 규칙으로 조립해 넘긴다.
      # 인코딩된 비밀번호는 secret 마스킹에 안 걸리므로 직접 가린다.
      - name: 접속 문자열 조립
        id: dburl
        run: |
          set +e
          out=$(node scripts/db-url.mjs 2>err.log)
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            cat err.log
            { echo '## 접속 문자열'; echo '```'; cat err.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::DATABASE_URL 을 만들지 못했습니다."
            exit 1
          fi
          echo "::add-mask::$out"
          echo "DATABASE_URL=$out" >> "$GITHUB_ENV"
          echo "붙는 곳: $(node scripts/db-url.mjs --show)"

      # 몇 번을 돌려도 결과가 같다. 이미 적용된 것은 건너뛴다.
      #
      # 출력을 파일로 받아 tee 로 흘리지 않는 이유: 파이프를 쓰면 브레이스 그룹의
      # 종료 코드가 마지막 echo 의 것이 되어 실패가 통째로 삼켜진다.
      # 실패해도 멈추지 않는다. 진단용 워크플로가 첫 실패에서 서면 나머지를
      # 못 본다 — 마이그레이션이 막혀도 test:rls 는 돌릴 수 있고, 그 결과가
      # "무엇이 적용돼 있는가" 를 알려준다.
      - name: 마이그레이션
        id: migrate
        run: |
          set +e
          npm run --silent db:migrate > migrate.log 2>&1
          code=$?
          set -e
          {
            echo '## 마이그레이션'
            echo '```'
            cat migrate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat migrate.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ]; then
            echo "::warning::마이그레이션이 실패했습니다. 뒤의 검사는 그대로 진행합니다."
          fi

      # 설정이 맞는지 본다. 실제로 막히는지는 test:rls 가 본다 — 다른 질문이다.
      - name: 권한·RLS 점검 (check_rls.sql)
        id: checkrls
        run: |
          set +e
          psql "$DATABASE_URL" -f supabase/check_rls.sql > rls.log 2>&1
          code=$?
          set -e
          {
            echo '## check_rls.sql'
            echo '```'
            cat rls.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat rls.log
          if [ $code -ne 0 ] || grep -q 'FAIL' rls.log; then
            echo "fail=1" >> "$GITHUB_OUTPUT"
            echo "::warning::check_rls 를 통과하지 못했습니다."
          fi

      # DATABASE_URL 없이 service_role 키만으로 돈다. 앞이 막혀도 여기는 된다.
      - name: 편집장 지정
        if: always() && inputs.admin_email != ''
        env:
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
          ADMIN_EMAIL_INPUT: ${{ inputs.admin_email }}
        run: |
          if [ -n "$ADMIN_LOGIN_PASSWORD" ]; then
            npm run --silent db:admin -- "$ADMIN_EMAIL_INPUT" --password "$ADMIN_LOGIN_PASSWORD"
          else
            npm run --silent db:admin -- "$ADMIN_EMAIL_INPUT"
          fi

      # 기획안 §6 M2 / M2-1 의 완료 기준. 계정 세 개를 만들어 우회를 시도하고 지운다.
      # 이 검사가 "무엇이 실제로 적용돼 있는가" 를 가장 정확히 말해 준다.
      # DATABASE_URL 이 아니라 service_role 키로 돌기 때문에 앞이 막혀도 돈다.
      - name: RLS 우회 테스트
        id: rlstest
        if: always() && inputs.run_rls_test
        run: |
          set +e
          npm run --silent test:rls > test.log 2>&1
          code=$?
          set -e
          {
            echo '## npm run test:rls'
            echo '```'
            cat test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat test.log
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # 전부 돌린 뒤에 판정한다.
      - name: 종합
        if: always()
        run: |
          fail=0
          [ "${{ steps.migrate.outputs.code }}" = "0" ] || { echo "마이그레이션 실패"; fail=1; }
          [ -z "${{ steps.checkrls.outputs.fail }}" ]  || { echo "check_rls 실패"; fail=1; }
          if [ "${{ inputs.run_rls_test }}" = "true" ]; then
            [ "${{ steps.rlstest.outputs.code }}" = "0" ] || { echo "test:rls 실패"; fail=1; }
          fi
          exit $fail
